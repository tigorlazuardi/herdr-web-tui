<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- user-scalable=no: kills touch/long-press zoom so Herdr's own
         click/tap handling isn't fought by the browser's pinch-zoom, and
         keeps columns tracking the real device width (design doc,
         "Frontend requirements"). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- PWA install (ticket 3, design doc "Frontend requirements"):
         display:standalone in manifest.json drops the browser chrome so
         the URL bar doesn't eat rows on a phone; theme-color and the
         apple-mobile-web-app-* trio give iOS/Android the same fullscreen,
         home-screen-app treatment without a separate native shell. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="herdr" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="herdr" />
    <title>herdr-web-tui</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
