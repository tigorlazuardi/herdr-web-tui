<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- user-scalable=no: kills touch/long-press zoom so Herdr's own
         click/tap handling isn't fought by the browser's pinch-zoom, and
         keeps columns tracking the real device width (design doc,
         "Frontend requirements").
         interactive-widget=resizes-content: when the soft keyboard opens,
         shrink the layout viewport (instead of the default overlay) so the
         position:fixed bottom:0 accessory key bar rides ABOVE the keyboard
         (Termux model) instead of hiding behind it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <!-- ponytail: install metadata only; add a service worker when offline use is required. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="herdr" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="herdr" />
    <title>herdr-web-tui</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
